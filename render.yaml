# Blueprint Render : API Laravel (Docker), base PostgreSQL hébergée chez Supabase.
# Mode d'emploi : docs/deploiement-render.md
# Aucun secret ici : les valeurs marquées `sync: false` sont saisies dans Render.

services:
  - type: web
    name: harmony-api
    runtime: docker
    region: frankfurt # même région que le projet Supabase (eu-central-1), la plus proche de Lomé
    plan: free # mise en veille après inactivité : plan payant conseillé en production
    dockerfilePath: ./harmony-api/Dockerfile
    dockerContext: ./harmony-api
    healthCheckPath: /up # ne dépend pas de la base : un réveil lent de Supabase ne bloque pas le déploiement
    buildFilter:
      paths:
        - harmony-api/**
    envVars:
      - key: APP_KEY
        sync: false # à saisir : sortie de `php artisan key:generate --show`
      - key: APP_URL
        sync: false # à saisir : l'URL publique du service (https://…onrender.com)
      - key: APP_NAME
        value: HARMONY
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Africa/Lome
      - key: APP_LOCALE
        value: fr
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      # Base Supabase via le pooler de sessions (IPv4, compatible avec Render gratuit).
      # Valeurs à copier depuis Supabase : Connect → Session pooler.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false # ex. aws-0-eu-central-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432" # port du mode session (le port 6543 du mode transaction casse les requêtes préparées)
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false # ex. postgres.<référence-du-projet>
      - key: DB_PASSWORD
        sync: false # mot de passe de la base Supabase
      - key: DB_SSLMODE
        value: require

      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: PORT
        value: "8080"

      # Premier compte de l'espace de gestion (/gestion), créé au démarrage s'il n'existe pas.
      # Retirer HARMONY_ADMIN_PASSWORD une fois connecté.
      - key: HARMONY_ADMIN_EMAIL
        sync: false
      - key: HARMONY_ADMIN_PASSWORD
        sync: false # 12 caractères minimum

      # Démonstration (à repasser à false avant l'ouverture au public).
      - key: HARMONY_SEED_DEMO
        value: "true" # catalogue de démonstration chargé une fois si la base est vide
      - key: OTP_EXPOSE_CODE
        value: "true" # aucun SMS branché : le code est affiché dans l'app
      - key: PAYMENTS_SANDBOX
        value: "true" # paiement simulé ; false dès que FedaPay est configuré

      # Paiements FedaPay (Mobile Money TMoney/Flooz et carte) : clés saisies par l'administrateur.
      - key: FEDAPAY_ENVIRONMENT
        value: sandbox # live en production
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: FEDAPAY_WEBHOOK_SECRET
        sync: false
      - key: HARMONY_BANK_TRANSFER_INSTRUCTIONS
        sync: false # coordonnées bancaires affichées au client qui choisit le virement

      # Photos de l'espace de gestion : le disque de Render est effacé à chaque déploiement.
      # Stockage S3 compatible (ex. Supabase Storage, bucket public) ; voir docs/deploiement-render.md.
      - key: MEDIA_DISK
        value: public # passer à s3 une fois les clés AWS_* saisies
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: eu-central-1
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false # ex. https://<référence>.supabase.co/storage/v1/s3
      - key: AWS_URL
        sync: false # ex. https://<référence>.supabase.co/storage/v1/object/public/<bucket>
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
