name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API Laravel (Pint + Pest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harmony-api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath, intl
          coverage: none
      - name: Dépendances
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Environnement
        run: cp .env.example .env && php artisan key:generate
      - name: Style (Pint)
        run: ./vendor/bin/pint --test
      - name: Tests (Pest)
        run: ./vendor/bin/pest

  app:
    name: App Flutter (analyze + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harmony-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dépendances
        run: flutter pub get
      - name: Analyse
        run: flutter analyze
      - name: Tests
        run: flutter test
