name: APK Android (test)

# Construit un APK installable pour tester HARMONY sur téléphone.
# Récupération : onglet « Releases » du dépôt (pré-versions « Build de test n° … »),
# ou artefact de l'exécution dans l'onglet Actions.
#
# APK de test, signé avec la clé de débogage : à ne pas publier sur le Play Store.

# Déclenchement volontaire uniquement : on publie un APK quand une livraison
# est prête, pas à chaque commit. Pour lancer un build :
#   git tag build-<n> && git push origin build-<n>
# (ou bouton « Run workflow » dans l'onglet Actions).
on:
  push:
    tags: ['build-*']
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour créer la pré-version

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harmony-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dépendances
        run: flutter pub get
      - name: Tests
        run: flutter test
      - name: Construction de l'APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Renommage
        run: cp build/app/outputs/flutter-apk/app-release.apk "harmony-test-${{ github.run_number }}.apk"
      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: harmony-apk-${{ github.run_number }}
          path: harmony-app/harmony-test-${{ github.run_number }}.apk
          retention-days: 14
      - name: Pré-version téléchargeable depuis le téléphone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-test-${{ github.run_number }}
          name: Build de test n° ${{ github.run_number }}
          prerelease: true
          body: |
            APK de test de HARMONY (commit ${{ github.sha }}).
            Installation : télécharger le fichier .apk depuis le téléphone, puis autoriser
            l'installation depuis le navigateur si Android le demande.
            Signé avec une clé de débogage : réservé aux tests.
          files: harmony-app/harmony-test-${{ github.run_number }}.apk
